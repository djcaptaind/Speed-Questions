<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teams | Callaway Chargers JROTC Answer Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="team-page">
<main class="shell">
  <section id="joinView" class="setup-stage">
    <section class="setup-card game-panel team-join-card">
      <div class="logo-stack compact">
        <img src="callaway-chargers-logo.png" alt="Callaway Chargers JROTC logo" class="hero-logo small">
        <div>
          <div class="kicker">Team / Player View</div>
          <h1>Join the Game</h1>
          <p>Enter the room code and your team name. You can change your answer until the instructor locks answers.</p>
        </div>
      </div>
      <div class="join-form-grid">
        <div>
          <label class="label" for="roomCode">Room Code</label>
          <input id="roomCode" class="input" placeholder="Example: EAGLES24" />
        </div>
        <div>
          <label class="label" for="teamName">Team Name</label>
          <input id="teamName" class="input" placeholder="Example: Chargers" />
        </div>
      </div>
      <div class="footer-links">
        <button id="joinBtn" class="btn btn-primary">Join Game</button>
        <a class="btn btn-ghost" href="host.html">Instructor Screen</a>
      </div>
      <p id="joinError" class="small error-text"></p>
    </section>
  </section>

  <section id="gameView" class="hidden">
    <header class="game-header hero-header game-panel">
      <div class="brand-lockup">
        <img src="callaway-chargers-logo.png" alt="Callaway Chargers JROTC" class="brand-logo">
        <div>
          <div class="eyebrow">Team / Player View</div>
          <h1 id="teamLabel">Your Team</h1>
          <div class="brand-subline">Room <strong id="roomLabel"></strong></div>
        </div>
      </div>
      <div class="header-badges">
        <div class="status-card">Status: <strong id="answerState"></strong></div>
      </div>
    </header>

    <div class="team-dashboard">
      <section class="game-panel team-question-panel">
        <div class="round-line"><span id="roundText">Waiting for host...</span><span class="phase-badge">LIVE</span></div>
        <h2 id="questionText" class="question">The instructor will start the first question.</h2>
        <div id="choices" class="choices team-choices"></div>
        <div class="status-box">
          <div id="statusMessage" class="status-message">Ready.</div>
        </div>
      </section>
      <aside class="game-panel leaderboard team-leaderboard">
        <div class="leaderboard-header"><h2>Leaderboard</h2><span>Live</span></div>
        <div id="scoreboard"></div>
      </aside>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="effects.js"></script>
<script src="app.js"></script>
</body>
</html>
