<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Callaway JROTC Team Answer Game</title><link rel="stylesheet" href="styles.css"/></head>
<body class="team-page"><main class="shell team-shell">
<section id="joinView" class="setup-stage"><section class="join-card game-panel"><div class="callaway-mark"><span class="mark-c">C</span><span><b>CALLAWAY</b><small>JROTC</small></span></div><div class="kicker">Team / Player View</div><h1>Join the Game</h1><p>Enter the room code shown by the instructor and choose your team name.</p><label class="label" for="roomCode">Room code</label><input id="roomCode" class="input" maxlength="8" placeholder="Example: EAGLES24" autocomplete="off"/><label class="label" for="teamName">Team name</label><input id="teamName" class="input" maxlength="20" placeholder="Example: Team Chargers" autocomplete="off"/><div class="footer-links"><button id="joinBtn" class="btn btn-primary">Join Game</button><a class="btn btn-ghost" href="host.html">Instructor / Host</a></div><p id="joinError" class="small"></p></section></section>
<section id="gameView" class="hidden"><header class="game-header team-header"><div class="callaway-mark large"><span class="mark-c">C</span><span><b>CALLAWAY</b><small>JROTC</small></span></div><div class="header-center"><div class="eyebrow">TEAM / PLAYER VIEW</div><h1 id="teamLabel">TEAM ANSWER GAME</h1></div><div class="room-chip">ROOM <strong id="roomLabel"></strong></div></header><div class="team-dashboard"><section class="game-panel team-question-panel"><div class="round-line"><span id="roundText">Waiting for host...</span><span class="phase-badge" id="answerState"></span></div><h2 id="questionText" class="question">The instructor will start the first question.</h2><div id="choices" class="choices team-choices"></div><div class="status-box"><div id="statusMessage" class="status-message">Ready.</div></div></section><aside class="game-panel leaderboard team-leaderboard"><div class="leaderboard-header"><h2>LEADERBOARD</h2><span>LIVE</span></div><div id="scoreboard"></div></aside></div></section>
</main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="effects.js"></script><script src="app.js"></script></body></html>
